<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b7410e"/>
    </marker>
    <marker id="arrowdead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b0b0b0"/>
    </marker>
  </defs>

  <!-- Column headings -->
  <text x="40"  y="30" font-size="15" font-weight="bold" fill="#444">STACK</text>
  <text x="520" y="30" font-size="15" font-weight="bold" fill="#444">HEAP</text>
  <line x1="470" y1="14" x2="470" y2="306" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ============ s1: moved-from, greyed out ============ -->
  <text x="40" y="66" font-size="15" font-style="italic" fill="#a0a0a0">s1</text>
  <text x="76" y="66" font-size="12" fill="#b0b0b0">(invalid after the move)</text>

  <g opacity="0.45">
    <rect x="40" y="76" width="330" height="34" fill="#f7f7f7" stroke="#b0b0b0" stroke-width="1.2"/>
    <line x1="150" y1="76" x2="150" y2="110" stroke="#b0b0b0" stroke-width="1.2"/>
    <line x1="260" y1="76" x2="260" y2="110" stroke="#b0b0b0" stroke-width="1.2"/>
    <text x="60"  y="98" font-size="13" fill="#888">ptr</text>
    <text x="170" y="98" font-size="13" fill="#888">len 5</text>
    <text x="280" y="98" font-size="13" fill="#888">cap 5</text>
  </g>
  <!-- strike-through indicating the binding is dead -->
  <line x1="40" y1="93" x2="370" y2="93" stroke="#c53030" stroke-width="1.6" opacity="0.55"/>
  <path d="M 372 93 C 430 93, 450 140, 514 168" fill="none" stroke="#b0b0b0" stroke-width="1.4"
        stroke-dasharray="4 4" marker-end="url(#arrowdead)" opacity="0.6"/>

  <!-- ============ s2: the live owner ============ -->
  <text x="40" y="196" font-size="15" font-style="italic" fill="#b7410e" font-weight="bold">s2</text>
  <text x="76" y="196" font-size="12" fill="#777">(owns the buffer)</text>

  <rect x="40" y="206" width="330" height="38" fill="#fdf6f2" stroke="#b7410e" stroke-width="1.6"/>
  <line x1="150" y1="206" x2="150" y2="244" stroke="#b7410e" stroke-width="1.2"/>
  <line x1="260" y1="206" x2="260" y2="244" stroke="#b7410e" stroke-width="1.2"/>
  <text x="60"  y="230" font-size="13" fill="#333">ptr</text>
  <text x="170" y="230" font-size="13" fill="#333">len 5</text>
  <text x="280" y="230" font-size="13" fill="#333">cap 5</text>

  <path d="M 372 225 C 430 225, 450 205, 514 194" fill="none" stroke="#b7410e" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- ============ Heap buffer ============ -->
  <g>
    <rect x="520" y="160" width="200" height="42" fill="#fafafa" stroke="#666" stroke-width="1.4"/>
    <line x1="560" y1="160" x2="560" y2="202" stroke="#ccc"/>
    <line x1="600" y1="160" x2="600" y2="202" stroke="#ccc"/>
    <line x1="640" y1="160" x2="640" y2="202" stroke="#ccc"/>
    <line x1="680" y1="160" x2="680" y2="202" stroke="#ccc"/>
    <text x="534" y="188" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#222">h</text>
    <text x="574" y="188" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#222">e</text>
    <text x="614" y="188" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#222">l</text>
    <text x="654" y="188" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#222">l</text>
    <text x="694" y="188" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#222">o</text>
    <text x="520" y="224" font-size="12" fill="#888">one allocation, freed once</text>
  </g>

  <!-- ============ Caption strip ============ -->
  <text x="40" y="290" font-size="13" fill="#555">
    <tspan font-family="DejaVu Sans Mono, monospace" fill="#b7410e">let s2 = s1;</tspan>
    <tspan dx="10">copies the three-word header, not the buffer.</tspan>
  </text>
</svg>
